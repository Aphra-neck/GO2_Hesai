go2_sdk2_bridge:
  ros__parameters:
    # Linux NIC connected to the Go2 robot network. Change this for your computer.
    network_interface: enP8p1s0
    domain_id: 0
    enabled: false
    world_frame: world
    body_frame: base_link
    path_topic: /body_path
    odom_topic: /lio/body_odom
    command_rate: 20.0
    path_timeout: 1.0
    odom_timeout: 0.5
    timestamp_future_tolerance: 0.2
    lookahead_distance: 0.6
    goal_position_tolerance: 0.15
    goal_yaw_tolerance: 0.20
    # Rotate in place above 45 deg; resume translation only after reaching 15 deg.
    heading_alignment_enter_angle: 0.7853981633974483
    heading_alignment_exit_angle: 0.2617993877991494
    # Explicit zero-length path rotations use a tighter completion threshold.
    explicit_rotation_tolerance: 0.05
    linear_gain: 1.0
    yaw_gain: 1.5
    max_vx: 0.6
    max_vy: 0.35
    max_yaw_rate: 0.8
