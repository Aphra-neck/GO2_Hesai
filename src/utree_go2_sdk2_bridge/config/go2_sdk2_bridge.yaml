go2_sdk2_bridge:
  ros__parameters:
    # Linux NIC connected to the Go2 robot network. Change this for your computer.
    network_interface: enP8p1s0
    domain_id: 0
    enabled: false
    world_frame: world
    body_frame: base_link
    path_topic: /body_path
    odom_topic: /lio/body_odom
    command_rate: 20.0
    path_timeout: 1.0
    odom_timeout: 0.5
    sport_state_timeout: 1.0
    timestamp_future_tolerance: 0.2
    lookahead_distance: 0.6
    # Commissioning mode: do not disarm solely because the current pose is
    # more than 0.05 m from the active path projection/final pose. Non-finite
    # geometry, stale inputs, reverse-command, and motion-response gates remain.
    path_cross_track_safety_gate_enabled: false
    # Same-goal path refreshes preserve tracker progress. A transient forward /
    # reverse mismatch holds a zero Move for at most 0.75 s while waiting for
    # the next planner path; the negative-vx safety gate is not disabled.
    goal_position_tolerance: 0.15
    goal_yaw_tolerance: 0.20
    # Rotate in place above 45 deg; resume translation only after reaching 15 deg.
    heading_alignment_enter_angle: 0.7853981633974483
    heading_alignment_exit_angle: 0.2617993877991494
    # Explicit zero-length path rotations use a tighter completion threshold.
    explicit_rotation_tolerance: 0.05
    linear_gain: 1.0
    yaw_gain: 1.5
    # The synchronized hardware capture showed repeated no-response episodes
    # while commands stayed at 0.069-0.137 m/s. Preserve direction but lift
    # non-zero translation above that observed band.
    minimum_translation_speed: 0.20
    # Disarm instead of leaving an unexecuted command stream armed indefinitely.
    motion_response_timeout: 2.0
    motion_response_min_translation: 0.04
    motion_response_min_yaw: 0.05
    max_vx: 0.6
    max_vy: 0.35
    max_yaw_rate: 0.8
