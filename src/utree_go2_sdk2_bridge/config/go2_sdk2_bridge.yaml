go2_sdk2_bridge:
  ros__parameters:
    # Linux NIC connected to the Go2 robot network. Change this for your computer.
    network_interface: enP8p1s0
    domain_id: 0
    enabled: false
    world_frame: world
    body_frame: base_link
    path_topic: /body_path
    odom_topic: /lio/body_odom
    # SportClient::Move is refreshed continuously at this rate.
    # Match Unitree's official 5 ms recurrent Move loop.
    command_rate: 200.0
    # Receipt-time input watchdogs; there is no path-geometry stop gate.
    path_timeout: 1.0
    odom_timeout: 0.5
    # L_T-style local route approximation: uniformly sample this truncated
    # prefix and combine all samples into one discounted heading target.
    lookahead_distance: 0.35
    truncated_path_sample_count: 8
    truncated_path_discount: 0.95
    waypoint_tolerance: 0.12
    # Reaching this position radius completes the route immediately. Final
    # lattice yaw is deliberately not chased with a forward arc.
    goal_position_tolerance: 0.15
    # Large heading errors force their sign; inside this switch band the last
    # +/- direction is retained so every translating Move keeps non-zero yaw.
    heading_alignment_enter_angle: 0.35
    heading_alignment_exit_angle: 0.12
    persistent_arc_switch_angle: 0.04
    # Fixed planar speed requested for every translating Move command.
    translation_speed: 0.40
    # Combine this fixed non-zero yaw rate with every translating command.
    rotation_speed: 0.60
    max_vx: 0.6
    max_vy: 0.35
    max_yaw_rate: 0.8
